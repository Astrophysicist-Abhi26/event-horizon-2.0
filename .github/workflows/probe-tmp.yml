name: probe-tmp
on:
  push:
    branches: [claude/keen-lamport-wukxfm]
    paths: [probe/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: pip install pyyaml
      - run: python -u probe/math_probe.py
