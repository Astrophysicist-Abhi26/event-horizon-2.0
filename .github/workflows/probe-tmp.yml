name: probe-tmp
on:
  push:
    branches: [claude/keen-lamport-wukxfm]
    paths: [probe/**]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: python -u probe/m2_dev.py
