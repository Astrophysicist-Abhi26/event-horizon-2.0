# Research profiles — one shared event database, ranked differently per profile.
#
# A profile never changes which events are collected or how they are tagged; it
# only changes how they are ranked. The site has a profile picker, and
# ?p=<profile id> in the page address opens a profile directly (a link you can
# bookmark or share). How a score is computed is explained at the top of
# scraper/profiles.py.
#
# Keys of a profile
#   label, blurb   shown in the picker
#   interests      taxonomy node -> weight 0-100 (or a level name below). A node is a
#                  field (cosmo, astro, ai, cs, math, physics) or a sub-field (cosmo.de,
#                  phys.condmat, ... — see scraper/taxonomy.py). For each tag of an
#                  event the MOST SPECIFIC node listed wins, so "physics: 30" plus
#                  "phys.condmat: 100" means condensed matter 100, other physics 30.
#                  Nodes not listed (nor their field) count 0: such events score 0.
#                  Negative weights push matching events down.
#   cross_field    share of the best weight from a second field that is added
#                  (an event spanning two of your fields ranks above one field)
#   synergies      bonus when an event combines areas. `when` lists groups; each
#                  group (a node, or a list of alternatives) must match. Within the
#                  same `group` name only the largest applicable bonus counts.
#   places         bonus by region: bengaluru, india, online, abroad, unknown
#   types          bonus by event type: Conference, Workshop, School,
#                  Talk / Seminar, Lecture series
#   focus          nodes behind the header's "focus" button and the
#   focus_label      "<focus> first, then date" sort (optional)
#
# Level names: top 100 · very_high 85 · high 70 · medium 45 · low 20 · none 0 · avoid -40

default: explore

profiles:

  explore:
    label: Explore everything
    blurb: Every field weighted equally. Sort by date to browse everything collected.
    interests: {cosmo: 50, astro: 50, ai: 50, cs: 50, math: 50, physics: 50}
    cross_field: 0
    places: {bengaluru: 10, india: 5}

  # ── Physics ────────────────────────────────────────────────────────────────

  condensed-quantum:
    label: Condensed matter & quantum physics
    blurb: >-
      Condensed matter and statistical physics, quantum matter and quantum
      information first; then mathematical physics, topology and related theory.
    focus: [phys.condmat, phys.quantum]
    focus_label: condensed matter & quantum
    interests:
      phys.condmat: 100
      phys.quantum: 90
      math.mathphys: 55
      math.topology: 40
      phys.hepth: 25            # QFT methods, anomalies, generalised symmetries
      phys.general: 25
      ai.science: 25
      math.probability: 25      # statistical mechanics, random systems
      phys.fluids: 20
      math.geometry: 15
      math.algebra: 15
      phys.gr: 10
      ai: 10
    cross_field: 0.25
    synergies:
      - {when: [phys.condmat, phys.quantum], bonus: 10}
      - {when: [phys.condmat, [math.topology, math.mathphys]], bonus: 10}   # topological matter
      - {when: [[phys.condmat, phys.quantum], ai], bonus: 8}
    places: {bengaluru: 10, india: 5}
    types: {School: 8, Workshop: 5}

